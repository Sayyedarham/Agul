services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_DB: observatory, POSTGRES_USER: observatory, POSTGRES_PASSWORD: observatory }
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data, ./migrations:/docker-entrypoint-initdb.d:ro]
  api:
    build: { context: ., dockerfile: Dockerfile.api }
    environment: { AUTHORIZED_CIDR: 192.168.1.0/24 }
    ports: ["8080:8080"]
    depends_on: [postgres]
  dashboard:
    image: node:22-alpine
    working_dir: /app
    volumes: [.:/app]
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 3000"
    ports: ["3000:3000"]
    depends_on: [api]
volumes: { postgres_data: {} }
